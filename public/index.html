<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sistema · ALDAM GLOBAL TECH</title>
  <link rel="icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --cyan: #22d3ee;
      --violet: #a78bfa;
      --card: rgba(255, 255, 255, .06);
      --line: rgba(255, 255, 255, .12)
    }

    html,
    body {
      min-height: 100%
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #e5e7f5;
      background: radial-gradient(1200px 700px at 10% -10%, #1e3a8a 0%, transparent 60%), radial-gradient(1000px 700px at 100% 0%, #5b21b6 0%, transparent 55%), #070b1d;
      background-attachment: fixed
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      backdrop-filter: blur(8px)
    }

    .neon {
      box-shadow: 0 0 0 1px rgba(34, 211, 238, .35), 0 0 18px rgba(34, 211, 238, .18)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem .95rem;
      border-radius: .75rem;
      font-weight: 600;
      font-size: .875rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .07);
      color: #e5e7f5;
      cursor: pointer;
      transition: .15s
    }

    .btn:hover {
      background: rgba(255, 255, 255, .14)
    }

    .btn-primary {
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      border: 0;
      color: #fff;
      box-shadow: 0 0 16px rgba(139, 92, 246, .4)
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      background: linear-gradient(90deg, #06b6d4, #8b5cf6)
    }

    .btn-danger {
      color: #fca5a5
    }

    .btn-sm {
      padding: .3rem .6rem;
      font-size: .78rem;
      border-radius: .6rem
    }

    .inp {
      width: 100%;
      background: rgba(7, 11, 29, .65);
      border: 1px solid var(--line);
      border-radius: .7rem;
      padding: .55rem .75rem;
      color: #fff;
      outline: none;
      font-size: .9rem
    }

    .inp:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, .25)
    }

    select.inp option {
      background: #0f1530
    }

    label.lbl {
      display: block;
      font-size: .72rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #9ca3c9;
      margin-bottom: .25rem
    }

    table.tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem
    }

    .tbl th {
      text-align: left;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #9ca3c9;
      padding: .6rem .7rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    .tbl td {
      padding: .6rem .7rem;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      vertical-align: middle
    }

    .tbl tr:hover td {
      background: rgba(255, 255, 255, .03)
    }

    .badge {
      display: inline-block;
      padding: .12rem .55rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700
    }

    .b-green {
      background: rgba(16, 185, 129, .18);
      color: #6ee7b7
    }

    .b-red {
      background: rgba(239, 68, 68, .2);
      color: #fca5a5
    }

    .b-yellow {
      background: rgba(245, 158, 11, .2);
      color: #fcd34d
    }

    .b-blue {
      background: rgba(34, 211, 238, .18);
      color: #67e8f9
    }

    .b-gray {
      background: rgba(148, 163, 184, .2);
      color: #cbd5e1
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .6rem .85rem;
      border-radius: .8rem;
      color: #b8bde0;
      font-weight: 500;
      white-space: nowrap
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff
    }

    .nav a.active {
      background: linear-gradient(90deg, rgba(6, 182, 212, .22), rgba(139, 92, 246, .25));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, .4)
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 15, .78);
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      padding: 1rem
    }

    .modal {
      background: #0d1230;
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      width: 100%;
      margin: auto;
      box-shadow: 0 0 40px rgba(139, 92, 246, .3)
    }

    .gradtxt {
      background: linear-gradient(90deg, #22d3ee, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .dd {
      position: absolute;
      z-index: 60;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: .25rem;
      max-height: 240px;
      overflow: auto;
      background: #0d1230;
      border: 1px solid var(--cyan);
      border-radius: .7rem
    }

    .dd div {
      padding: .5rem .75rem;
      cursor: pointer;
      font-size: .85rem
    }

    .dd div:hover {
      background: rgba(34, 211, 238, .15)
    }

    .bar {
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      height: 10px;
      border-radius: 99px
    }

    /* Fondo animado de la marca (opcional) */
    #bgvid {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .14;
      pointer-events: none
    }

    /* Documento imprimible */
    .paper {
      background: #fff;
      color: #111827;
      padding: 32px 36px;
      font-size: 12.5px;
      line-height: 1.45;
      font-family: Inter, system-ui, sans-serif
    }

    .paper h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0
    }

    .paper table {
      width: 100%;
      border-collapse: collapse
    }

    .paper th {
      background: #111a3a;
      color: #fff;
      text-align: left;
      padding: 7px 8px;
      font-size: 11px;
      text-transform: uppercase
    }

    .paper td {
      padding: 7px 8px;
      border-bottom: 1px solid #e5e7eb
    }

    .paper .r {
      text-align: right
    }

    .paper .accent {
      height: 5px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      border-radius: 9px;
      margin: 12px 0
    }

    #printRoot {
      display: none
    }

    @media print {
      body {
        background: #fff !important
      }

      #app,
      #modals,
      #toast {
        display: none !important
      }

      #printRoot {
        display: block
      }

      .paper {
        padding: 0
      }

      @page {
        size: A4;
        margin: 14mm
      }

      tr {
        page-break-inside: avoid
      }
    }

    ::-webkit-scrollbar {
      height: 8px;
      width: 8px
    }

    ::-webkit-scrollbar-thumb {
      background: #3b3f73;
      border-radius: 9px
    }
  </style>
</head>

<body>
  <video id="bgvid" autoplay muted loop playsinline>
    <source src="fondo.mp4" type="video/mp4">
  </video>
  <div id="app" class="min-h-screen lg:flex">
    <aside class="lg:w-64 lg:min-h-screen lg:sticky lg:top-0 lg:h-screen p-3 lg:p-4 lg:shrink-0">
      <div class="card neon p-3 lg:h-full flex lg:flex-col gap-3 items-center lg:items-stretch overflow-x-auto">
        <div id="brand" class="flex items-center gap-3 lg:pb-3 lg:border-b border-white/10 shrink-0"></div>
        <nav id="nav" class="nav flex lg:flex-col gap-1 lg:flex-1 lg:overflow-y-auto"></nav>
        <div class="hidden lg:block text-[11px] text-slate-400 px-2">🟢 Datos guardados en el servidor<br><span
            id="syncInfo"></span></div>
      </div>
    </aside>
    <main class="flex-1 p-3 lg:p-6 min-w-0">
      <div id="view"></div>
    </main>
  </div>
  <div id="modals"></div>
  <div id="printRoot"></div>
  <div id="toast" class="fixed bottom-4 right-4 z-[70] space-y-2"></div>
  <script src="app.js"></script>
</body>

</html>
